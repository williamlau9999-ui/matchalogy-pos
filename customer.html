<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f4f2">
  <title>Matchalogy Order</title>
  <link rel="icon" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="stylesheet" href="./customer.css">
</head>
<body>

<header class="customer-header">
  <img src="./logo.png" alt="Matchalogy" class="brand-logo">
  <div>
    <h1>Matchalogy</h1>
    <p>Order & collect at counter</p>
  </div>
</header>

<div id="storeStatusBanner" class="store-status-banner">
  Loading store status...
</div>

<main>

  <div class="customer-search-wrap">
    <input
      id="customerSearch"
      type="search"
      placeholder="Search menu"
      autocomplete="off"
    >
  </div>

  <div class="category-tabs">
    <button class="category-tab active" data-category="all">All</button>
    <button class="category-tab" data-category="matcha">Matcha</button>
    <button class="category-tab" data-category="espresso">Espresso</button>
    <button class="category-tab" data-category="basque">Basque</button>
    <button class="category-tab" data-category="mousse">Mousse</button>
    <button class="category-tab" data-category="other">Other</button>
  </div>

  <div id="customerProducts" class="customer-products">
    <div class="empty-state">Loading menu...</div>
  </div>

</main>

<button id="openCartBtn" class="floating-cart">
  <span>Cart <strong id="cartCount">0</strong></span>
  <strong>RM <span id="floatingTotal">0.00</span></strong>
</button>

<div id="customerModifierModal" class="customer-modal">
  <div class="customer-modal-box">

    <div class="modal-heading">
      <h2 id="customerModifierTitle">Product</h2>
      <button id="closeModifierBtn" class="icon-button" aria-label="Close">×</button>
    </div>

    <div class="modifier-field" id="customerMilkGroup">
      <label>Milk</label>
      <select id="customerMilk"></select>
    </div>

    <div class="modifier-field" id="customerIceGroup">
      <label>Ice</label>
      <select id="customerIce"></select>
    </div>

    <div class="modifier-field" id="customerSweetGroup">
      <label>Sweetness</label>
      <select id="customerSweet"></select>
    </div>

    <div class="modifier-field" id="customerAddonGroup">
      <label>Add-on</label>
      <select id="customerAddon"></select>
    </div>

    <div class="modifier-field" id="customerNoteGroup">
      <label>Item Note</label>
      <textarea
        id="customerItemNote"
        maxlength="200"
        placeholder="Example: no straw, pack separately..."
      ></textarea>
    </div>

    <button id="customerAddModifierBtn">Add To Cart</button>

  </div>
</div>

<div id="customerCartModal" class="customer-modal">
  <div class="customer-modal-box cart-modal-box">

    <div class="modal-heading">
      <h2>Your Order</h2>
      <button id="closeCartBtn" class="icon-button" aria-label="Close">×</button>
    </div>

    <div id="customerCartList"></div>

  <div class="checkout-total">
      <span>Total</span>
      <strong>RM <span id="customerTotal">0.00</span></strong>
    </div>

    <div class="customer-details">
      <label for="customerName">Pickup Name</label>
      <input id="customerName" maxlength="50" placeholder="Your name" autocomplete="name">

      <label for="customerPhone">Phone Number</label>
      <input id="customerPhone" maxlength="30" inputmode="tel" placeholder="Optional" autocomplete="tel">

      <label for="customerOrderNote">Order Note</label>
      <textarea
        id="customerOrderNote"
        maxlength="300"
        placeholder="Example: collect at 3:30 PM..."
      ></textarea>
    </div>

    <button id="submitCustomerOrderBtn">Submit Order</button>

    <p class="payment-notice">
      Please pay at the counter after submitting.
    </p>

  </div>
</div>

<div id="orderSuccessModal" class="customer-modal">
  <div class="customer-modal-box success-box">

    <div class="success-icon">✓</div>
    <h2>🎉 订单已成功提交</h2>
    <p style="margin-top: 5px; color: #666;">您的订单编号：</p>

    <strong id="customerOrderNumber" class="customer-order-number" style="margin: 10px 0;">
      QR000000
    </strong>

    <!-- 状态显示区域 (保留原本系统所需的 ID，防止报错) -->
    <div id="customerOrderStatus" class="customer-order-status pending">
      Waiting for shop confirmation...
    </div>

    <div id="customerOrderStatusDetail" class="customer-order-status-detail">
      Please pay at the counter after the order is accepted.
    </div>

    <!-- ⭐ 新增：绿色 WhatsApp 发送按钮 -->
    <button id="sendWhatsappBtn" style="background-color: #25D366; color: white; font-weight: bold; font-size: 16px; padding: 14px; border-radius: 12px; width: 100%; border: none; cursor: pointer; margin: 15px 0 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
      📲 点击前往 WhatsApp 发送订单
    </button>

    <button id="closeSuccessBtn">关闭 / Done</button>

  </div>
</div>

<script type="module" src="./customer.js"></script>
</body>
</html>
