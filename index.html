<!DOCTYPE html>
<html lang="zh">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Matchalogy POS</title>

<link rel="manifest" href="manifest.json">


  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

<div class="left">

  <h1>🍵 Matchalogy POS</h1>

  <div class="tabs">

    <button
      class="tab active"
      data-category="all"
    >
      All
    </button>

    <button
      class="tab"
      data-category="matcha"
    >
      Matcha
    </button>

    <button
      class="tab"
      data-category="espresso"
    >
      Espresso
    </button>

    <button
      class="tab"
      data-category="basque"
    >
      Basque
    </button>

    <button
      class="tab"
      data-category="mousse"
    >
      Mousse
    </button>

    <button
      class="tab"
      data-category="other"
    >
      Other
    </button>

  </div>

  <div
    class="products"
    id="products"
  ></div>

</div>

<div class="right">

  <h2>🧾 Cart</h2>

  <ul id="cart"></ul>

<input
  id="discount"
  placeholder="Discount RM"
/>

  <div class="total">
    RM <span id="total">0</span>
  </div>

  <button id="clearCartBtn">
    Clear Cart
  </button>

  <button id="cashBtn">
    Cash
  </button>

  <button id="tngBtn">
    TNG
  </button>

<button id="ShopeeBtn">
    Shopee
  </button>

  <hr>

  <div class="dashboard">

<div class="recent-orders">

  <h2>Recent Orders</h2>

  <div id="ordersList"></div>

</div>

    <h2>📊 Dashboard</h2>

    <div class="dash-card">

      <div>Today Revenue</div>

      <strong>
        RM <span id="todayRevenue">0</span>
      </strong>

    </div>

    <div class="dash-card">

      <div>Today Orders</div>

      <strong id="todayOrders">
        0
      </strong>

    </div>

  </div>

  <hr>

<div class="card-box">

  <div>Total Discount</div>

  <h2>
    RM
    <span id="todayDiscount">
      0
    </span>
  </h2>

</div>

  <h2>➕ Add / Edit Product</h2>

  <input
    id="name"
    placeholder="Product Name"
  />

  <input
    id="price"
    placeholder="Price"
  />

  <input
    id="category"
    placeholder="Category"
  />

  <input
    id="image"
    placeholder="Image URL"
  />

  <button id="saveBtn">
    Save Product
  </button>

</div>

<div
  id="modifierModal"
  class="modifier-modal"
>

  <div class="modifier-box">

    <h2 id="modifierTitle">
      Product
    </h2>

    <div class="modifier-group">

      <label>Milk</label>

      <select id="milkSelect">

        <option>Fresh Milk</option>

        <option>Oat Milk</option>

        <option>Coconut Milk</option>

      </select>

    </div>

    <div class="modifier-group">

      <label>Ice</label>

      <select id="iceSelect">

        <option>Normal Ice</option>

        <option>Less Ice</option>

        <option>No Ice</option>

      </select>

    </div>

    <div class="modifier-group">

      <label>Sweetness</label>

      <select id="sweetSelect">

        <option>100%</option>

        <option>70%</option>

        <option>50%</option>

        <option>30%</option>

        <option>0%</option>

      </select>

    </div>

    <div class="modifier-group">

      <label>Add-on</label>

      <select id="addonSelect">

        <option value="0">
          None
        </option>

        <option value="2">
          Extra Shot +RM2
        </option>

        <option value="3">
          Matcha Foam +RM3
        </option>

      </select>

    </div>

    <div class="modifier-group">

      <label>Customer Note</label>

      <textarea
        id="noteInput"
        placeholder="Less sweet..."
      ></textarea>

    </div>

    <button id="addModifierBtn">

      Add To Cart

    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script
  type="module"
  src="app.js"
></script>

<div id="receiptModal" class="modifier-modal">
  <div class="modifier-box">
    <div id="receiptContent"></div>

    <button id="printReceiptBtn">Print Receipt</button>
    <button id="closeReceiptBtn">Close</button>
  </div>
</div>

</body>

</html>
